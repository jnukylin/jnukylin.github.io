<!-- Navigation -->
{% if page.nav-style == "invert" or page.header-style == "text" %}
<nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top invert">
    {% else %}
    <nav class="navbar navbar-expand-lg navbar-light bg-light fixed-top">
        {% endif %}
        <div class="container-fluid">
            <a class="navbar-brand" href="{{ site.baseurl }}/">{{ site.title }}</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{{ site.baseurl }}/">Home</a>
                    </li>
                    {% for page in site.pages %}
                    {% if page.title and page.hide-in-nav != true %}
                    <li class="nav-item">
                        <a class="nav-link" href="{{ page.url | prepend: site.baseurl }}">{{ page.title }}</a>
                    </li>
                    {% endif %}
                    {% endfor %}
                    <li class="nav-item">
                        <a class="nav-link search-icon" href="javascript:void(0)">
                            <i class="fas fa-search"></i>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        // Bootstrap 5 handles navbar toggle automatically
        // We only need to handle the search icon click
        document.addEventListener('click', function(e) {
            if (e.target.closest('.search-icon')) {
                // Your search handling code here
            }
        });
    </script>
